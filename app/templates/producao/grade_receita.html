{% extends "base.html" %}
{% block title %}Grade · {{ grade.receita_nome }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <h3 class="mb-0">
        <i class="bi bi-calendar3"></i> {{ grade.receita_nome }}
        <small class="text-muted fs-6">— grade loja × dia ({{ horizonte }} dia(s))</small>
    </h3>
    <a href="{{ url_for('producao.painel', horizonte=horizonte, janela=janela) }}"
       class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar ao balanço
    </a>
</div>

{% include 'producao/_grade_receita_tabela.html' %}
{% endblock %}
