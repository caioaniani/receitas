{% extends "base.html" %}
{% import "_area_nav.html" as areanav with context %}

{% block title %}{{ area.titulo }}{% endblock %}

{% block content %}
<style>
.area-wrap { max-width: 900px; margin: 0 auto; }
.area-hero {
    background: linear-gradient(135deg, color-mix(in srgb, var(--bg-card) 92%, #ffffff 8%) 0%, var(--bg-card) 100%);
    border: 1px solid var(--border-color);
    border-left: 5px solid var(--cor, #0d6efd);
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
    padding: 1.1rem 1.25rem;
    margin: 1rem 0 1.2rem;
}
.area-back {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: 13px; text-decoration: none; color: var(--text-muted, #888);
    margin-bottom: .6rem;
}
.area-back:hover { color: var(--cor, #0d6efd); }
.area-hero-row { display: flex; align-items: center; gap: .9rem; }
.area-hero-ic {
    width: 52px; height: 52px; border-radius: 15px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; font-size: 27px;
    background: color-mix(in srgb, var(--cor, #0d6efd) 12%, white 88%);
}
.area-hero h1 { font-weight: 800; font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -0.03em; margin: 0; }
.area-hero p { color: var(--text-muted, #888); margin: .15rem 0 0; font-size: 14px; }

.area-links {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: .6rem;
    margin-bottom: 3rem;
}
.area-subhead {
    grid-column: 1 / -1;
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--text-muted, #888); font-weight: 700;
    margin: .5rem 0 -.15rem .15rem;
}
.area-link {
    display: flex; align-items: center; gap: .7rem;
    background: color-mix(in srgb, var(--bg-card) 94%, #ffffff 6%);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: .8rem .9rem;
    text-decoration: none;
    color: var(--text-main, inherit);
    box-shadow: var(--shadow-sm);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease, background .15s ease;
}
.area-link:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
    border-color: color-mix(in srgb, var(--cor, #0d6efd) 45%, var(--border-color));
    color: inherit;
}
.area-link-ic {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; font-size: 16px;
    background: color-mix(in srgb, var(--cor, #0d6efd) 12%, white 88%);
    color: color-mix(in srgb, var(--cor, #0d6efd) 78%, black 22%);
}
.area-link-txt { font-weight: 600; font-size: 14.5px; }
.area-link-sub {
    padding-top: .55rem; padding-bottom: .55rem;
    background: transparent;
    box-shadow: none;
    border-style: dashed;
}
.area-link-sub .area-link-ic {
    width: 26px; height: 26px; font-size: 13px;
    background: color-mix(in srgb, var(--cor, #0d6efd) 8%, transparent);
}
.area-link-sub .area-link-txt { font-weight: 500; font-size: 13.5px; color: var(--text-muted, #777); }
</style>

<div class="area-wrap" style="--cor: {{ area.cor }};">
    <div class="area-hero">
        <a href="{{ url_for('main.index') }}" class="area-back"><i class="bi bi-arrow-left"></i> Início</a>
        <div class="area-hero-row">
            <span class="area-hero-ic">{{ area.icone }}</span>
            <div>
                <h1>{{ area.titulo }}</h1>
                <p>{{ area.desc }}</p>
            </div>
        </div>
    </div>

    <div class="area-links">
        {{ areanav.render(area.slug, 'area') }}
    </div>
</div>
{% endblock %}
