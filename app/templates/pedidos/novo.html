{% extends "base.html" %}

{% block title %}Novo Pedido{% endblock %}

{% block content %}
<h1 class="page-title mb-3"><i class="bi bi-cart-plus"></i> Novo Pedido</h1>

<form method="POST" id="form-pedido">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row g-3 mb-3">
        {% if current_user.is_admin() or current_user.is_gerente() %}
        <div class="col-md-4">
            <label class="form-label fw-semibold">Loja</label>
            <select name="loja_id" class="form-select form-select-sm" required>
                <option value="">Selecione...</option>
                {% for l in lojas %}
                <option value="{{ l.id }}" {% if loja_id == l.id %}selected{% endif %}>{{ l.nome }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        <div class="col-md-3">
            <label class="form-label fw-semibold">Data de Entrega</label>
            <input type="date" name="data_entrega" class="form-control form-control-sm"
                   value="{{ amanha }}" min="{{ amanha }}" required>
        </div>
        <div class="col-md-5">
            <label class="form-label fw-semibold">Observacao</label>
            <input type="text" name="observacao" class="form-control form-control-sm" placeholder="Opcional...">
        </div>
    </div>

    <h6 class="fw-bold mb-2">Itens do Pedido</h6>

    <div class="table-responsive">
        <table class="table table-sm table-bordered bg-white" id="itens-table">
            <thead class="thead-padaria">
                <tr>
                    <th>Produto</th>
                    <th style="width:100px">Qtd</th>
                    <th style="width:130px">Estado</th>
                    <th>Obs</th>
                    <th style="width:40px"></th>
                </tr>
            </thead>
            <tbody id="itens-body">
                <tr class="item-row">
                    <td>
                        <select name="item_id[]" class="form-select form-select-sm item-sel" required>
                            <option value="">Selecione...</option>
                            {% set ns = namespace(cat_atual=None) %}
                            {% for r in receitas %}
                                {% if r.categoria != ns.cat_atual %}
                                    {% if ns.cat_atual is not none %}</optgroup>{% endif %}
                                    <optgroup label="Paes &mdash; {{ r.categoria or 'Outros' }}">
                                    {% set ns.cat_atual = r.categoria %}
                                {% endif %}
                                <option value="r_{{ r.id }}">{{ r.nome }}</option>
                            {% endfor %}
                            {% if ns.cat_atual is not none %}</optgroup>{% endif %}
                            {% if materias %}
                            <optgroup label="Materias-primas">
                                {% for mp in materias %}
                                <option value="mp_{{ mp.id }}">{{ mp.nome }}{% if mp.unidade %} ({{ mp.unidade }}){% endif %}</option>
                                {% endfor %}
                            </optgroup>
                            {% endif %}
                        </select>
                    </td>
                    <td>
                        <input type="number" name="item_qtd[]" class="form-control form-control-sm input-blue" min="1" value="1">
                    </td>
                    <td>
                        <select name="item_estado[]" class="form-select form-select-sm">
                            <option value="">Padrão</option>
                            <option value="backup">Backup</option>
                            <option value="assado">Assado</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" name="item_obs[]" class="form-control form-control-sm" placeholder="">
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-sm btn-outline-danger btn-remove-item" onclick="this.closest('tr').remove()">
                            <i class="bi bi-x"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-add-item">
            <i class="bi bi-plus-lg"></i> Adicionar Item
        </button>
        <button type="submit" class="btn btn-primary btn-sm">
            <i class="bi bi-check-lg"></i> Criar Pedido
        </button>
        <a href="{{ url_for('pedidos.lista') }}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
var itemOpts = document.querySelector('.item-row .item-sel').innerHTML;

document.getElementById('btn-add-item').addEventListener('click', function() {
    var tbody = document.getElementById('itens-body');
    var tr = document.createElement('tr');
    tr.className = 'item-row';
    tr.innerHTML =
        '<td><select name="item_id[]" class="form-select form-select-sm item-sel" required>' + itemOpts + '</select></td>' +
        '<td><input type="number" name="item_qtd[]" class="form-control form-control-sm input-blue" min="1" value="1"></td>' +
        '<td><input type="text" name="item_obs[]" class="form-control form-control-sm" placeholder=""></td>' +
        '<td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger btn-remove-item" onclick="this.closest(\'tr\').remove()"><i class="bi bi-x"></i></button></td>';
    tbody.appendChild(tr);
});
</script>
{% endblock %}
