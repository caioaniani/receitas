{% extends "base.html" %}

{% block title %}Novo Pedido{% endblock %}

{% block content %}
<h1 class="page-title mb-3"><i class="bi bi-cart-plus"></i> Novo Pedido</h1>

<form method="POST" id="form-pedido">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row g-3 mb-3">
        {% if current_user.is_admin() or current_user.is_gerente() %}
        <div class="col-md-4">
            <label class="form-label fw-semibold">Loja</label>
            <select name="loja_id" class="form-select form-select-sm" required>
                <option value="">Selecione...</option>
                {% for l in lojas %}
                <option value="{{ l.id }}" {% if loja_id == l.id %}selected{% endif %}>{{ l.nome }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        <div class="col-md-3">
            <label class="form-label fw-semibold">Data de Entrega</label>
            <input type="date" name="data_entrega" class="form-control form-control-sm"
                   value="{{ amanha }}" min="{{ data_min }}" required>
        </div>
        <div class="col-md-5">
            <label class="form-label fw-semibold">Observacao</label>
            <input type="text" name="observacao" class="form-control form-control-sm" placeholder="Opcional...">
        </div>
    </div>

    <h6 class="fw-bold mb-2">Itens do Pedido</h6>

    <div class="table-responsive">
        <table class="table table-sm table-bordered bg-white" id="itens-table">
            <thead class="thead-padaria">
                <tr>
                    <th>Produto</th>
                    <th style="width:100px">Qtd</th>
                    <th style="width:130px">Estado</th>
                    <th>Obs</th>
                    <th style="width:40px"></th>
                </tr>
            </thead>
            <tbody id="itens-body">
                <tr class="item-row">
                    <td>
                        <input type="text" class="form-control form-control-sm item-busca"
                               placeholder="Digite o nome..." autocomplete="off">
                        <input type="hidden" name="item_id[]" class="item-id">
                    </td>
                    <td>
                        <input type="number" name="item_qtd[]" class="form-control form-control-sm input-blue" min="1" value="1">
                    </td>
                    <td>
                        <select name="item_estado[]" class="form-select form-select-sm">
                            <option value="">Padrão</option>
                            <option value="backup">Backup</option>
                            <option value="assado">Assado</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" name="item_obs[]" class="form-control form-control-sm" placeholder="">
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-sm btn-outline-danger btn-remove-item" onclick="this.closest('tr').remove()">
                            <i class="bi bi-x"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-add-item">
            <i class="bi bi-plus-lg"></i> Adicionar Item
        </button>
        <button type="submit" class="btn btn-primary btn-sm">
            <i class="bi bi-check-lg"></i> Criar Pedido
        </button>
        <a href="{{ url_for('pedidos.lista') }}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
    </div>
</form>
{% endblock %}

{% block scripts %}
<style>
.item-results {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    max-height: 300px;
    overflow-y: auto;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    z-index: 3000;
}
.item-result-opt {
    padding: 10px 12px;
    cursor: pointer;
    color: var(--text-main);
    border-bottom: 1px solid var(--border-color);
}
.item-result-opt:hover {
    background-color: var(--bg-card-hover);
}
.item-result-opt:last-child {
    border-bottom: none;
}
</style>
<script>
(function () {
    var tbody = document.getElementById('itens-body');
    var timers = new WeakMap();  // debounce por linha (chave = o input)

    function rowParts(el) {
        var td = el.closest('td');
        return {
            input: td.querySelector('.item-busca'),
            hidden: td.querySelector('.item-id'),
            results: td.querySelector('.item-results'),
        };
    }

    // Posiciona o dropdown como FIXED (coords da viewport) pra escapar do
    // overflow do .table-responsive, que senao corta a lista dentro da celula.
    function positionResults(input, results) {
        var rect = input.getBoundingClientRect();
        results.style.position = 'fixed';
        results.style.top = rect.bottom + 'px';
        results.style.left = rect.left + 'px';
        results.style.width = rect.width + 'px';
        results.style.right = 'auto';
    }

    function renderResults(input, results, itens) {
        results.innerHTML = '';
        if (!itens || itens.length === 0) {
            results.style.display = 'none';
            return;
        }
        itens.forEach(function (item) {
            var opt = document.createElement('div');
            opt.className = 'item-result-opt';
            opt.dataset.id = item.id;
            opt.textContent = item.nome;  // textContent escapa o nome (sem innerHTML cru)
            results.appendChild(opt);
        });
        positionResults(input, results);
        results.style.display = 'block';
    }

    // Digitar: zera o id antigo (so volta a valer ao escolher) e busca.
    tbody.addEventListener('input', function (e) {
        if (!e.target.classList.contains('item-busca')) return;
        var input = e.target;
        var parts = rowParts(input);
        parts.hidden.value = '';
        var val = input.value.trim();

        clearTimeout(timers.get(input));
        if (val.length < 2) {
            parts.results.style.display = 'none';
            return;
        }
        timers.set(input, setTimeout(function () {
            fetch('/pedidos/buscar-itens.json?q=' + encodeURIComponent(val))
                .then(function (r) { return r.json(); })
                .then(function (data) { renderResults(parts.input, parts.results, data.itens); })
                .catch(function () { parts.results.style.display = 'none'; });
        }, 250));
    });

    // Escolher uma opcao: preenche texto visivel + hidden.
    tbody.addEventListener('click', function (e) {
        var opt = e.target.closest('.item-result-opt');
        if (!opt) return;
        var parts = rowParts(opt);
        parts.input.value = opt.textContent;
        parts.hidden.value = opt.dataset.id;
        parts.results.style.display = 'none';
    });

    // Clicar fora dos campos de busca fecha os dropdowns abertos.
    document.addEventListener('click', function (e) {
        if (e.target.closest('.item-busca') || e.target.closest('.item-result-opt')) return;
        tbody.querySelectorAll('.item-results').forEach(function (r) {
            r.style.display = 'none';
        });
    });

    // Reposiciona o dropdown aberto quando a pagina rola (posicao fixed segue o input).
    window.addEventListener('scroll', function () {
        tbody.querySelectorAll('.item-results').forEach(function (r) {
            if (r.style.display === 'block') {
                positionResults(r.closest('td').querySelector('.item-busca'), r);
            }
        });
    }, true);

    // Adicionar linha: so insere o HTML; a delegation acima ja cobre a nova linha.
    document.getElementById('btn-add-item').addEventListener('click', function () {
        var tr = document.createElement('tr');
        tr.className = 'item-row';
        tr.innerHTML =
            '<td><div style="position: relative;"><input type="text" class="form-control form-control-sm item-busca" placeholder="Digite o nome..." autocomplete="off"><input type="hidden" name="item_id[]" class="item-id"><div class="item-results" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; border-radius: 4px; max-height: 300px; overflow-y: auto; z-index: 1000; display: none;"></div></div></td>' +
            '<td><input type="number" name="item_qtd[]" class="form-control form-control-sm input-blue" min="1" value="1"></td>' +
            '<td><select name="item_estado[]" class="form-select form-select-sm"><option value="">Padrão</option><option value="backup">Backup</option><option value="assado">Assado</option></select></td>' +
            '<td><input type="text" name="item_obs[]" class="form-control form-control-sm" placeholder=""></td>' +
            '<td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger btn-remove-item" onclick="this.closest(\'tr\').remove()"><i class="bi bi-x"></i></button></td>';
        tbody.appendChild(tr);
    });
})();
</script>
{% endblock %}
