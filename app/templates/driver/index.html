<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="theme-color" content="#0f172a">
    <title>Entregas — {{ driver.nome }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --cor-driver: {{ driver.cor or '#0d6efd' }}; }
        body { background:#f1f5f9; -webkit-tap-highlight-color: transparent; }
        .topo { background:var(--cor-driver); color:#fff; padding:12px 14px; position:sticky; top:0; z-index:10; box-shadow:0 1px 4px rgba(0,0,0,.1); }
        .topo h1 { font-size:18px; margin:0; font-weight:600; }
        .topo .data { opacity:.85; font-size:13px; }
        .pedido-card { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin:10px; padding:14px; }
        .pedido-card.entregue { border-left:5px solid #16a34a; }
        .pedido-card.nao_entregue { border-left:5px solid #dc2626; opacity:.85; }
        .pedido-card.pendente { border-left:5px solid #cbd5e1; }
        .badge-status { font-size:11px; padding:3px 8px; border-radius:6px; }
        .badge-status.entregue { background:#16a34a; color:#fff; }
        .badge-status.nao_entregue { background:#dc2626; color:#fff; }
        .badge-status.pendente { background:#e2e8f0; color:#475569; }
        .btn-acao { width:100%; padding:14px; font-size:15px; font-weight:500; }
        .foto-thumb { width:80px; height:80px; object-fit:cover; border-radius:8px; }
        .foto-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
        .foto-wrap { position:relative; }
        .foto-wrap .x { position:absolute; top:-4px; right:-4px; background:#dc2626; color:#fff; border-radius:50%; width:22px; height:22px; line-height:22px; text-align:center; font-size:14px; cursor:pointer; }
        .login-box { max-width:340px; margin:80px auto; padding:24px; background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); text-align:center; }
        .pin-input { font-size:28px; letter-spacing:8px; text-align:center; }
        .vazio { text-align:center; padding:40px 20px; color:#64748b; }
        @media (max-width:480px) {
            .pedido-card { margin:8px 6px; padding:12px; }
        }
    </style>
</head>
<body>

<!-- Tela de PIN (se exigido) -->
<div id="login-screen" style="display:none;">
    <div class="login-box">
        <i class="bi bi-shield-lock" style="font-size:36px; color:var(--cor-driver);"></i>
        <h5 class="mt-2 mb-3">Olá, {{ driver.nome }}</h5>
        <p class="text-muted small mb-3">Digite seu PIN de 4 dígitos pra acessar suas entregas.</p>
        <input type="tel" inputmode="numeric" maxlength="6" id="pin-input" class="form-control pin-input mb-2" autocomplete="one-time-code">
        <button id="btn-login" class="btn btn-primary w-100" style="background:var(--cor-driver); border:0;">
            Entrar
        </button>
        <div id="login-erro" class="text-danger small mt-2" style="display:none;"></div>
    </div>
</div>

<!-- Tela principal (entregas) -->
<div id="app-screen" style="display:none;">
    <div class="topo">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1><i class="bi bi-truck"></i> {{ driver.nome }}</h1>
                <div class="data" id="topo-data"></div>
            </div>
            <input type="date" id="data-input" class="form-control form-control-sm" style="max-width:160px; background:rgba(255,255,255,.95);" value="{{ hoje }}">
        </div>
        <div class="mt-2">
            <a href="{{ url_for('driver.pedidos_loja', token=token) }}" class="btn btn-sm btn-light" style="font-weight:600;">
                <i class="bi bi-shop"></i> Pedidos de loja (entregas QR)
            </a>
        </div>
    </div>

    <div id="loading" class="vazio" style="display:none;">
        <div class="spinner-border text-primary"></div>
        <div class="mt-2">Carregando…</div>
    </div>

    <div id="pedidos-container"></div>

    <div id="vazio-msg" class="vazio" style="display:none;">
        <i class="bi bi-inbox" style="font-size:42px; opacity:.4;"></i>
        <div class="mt-2">Nenhuma entrega para essa data.</div>
    </div>
</div>

<!-- Modal: detalhe do pedido -->
<div class="modal fade" id="modal-pedido" tabindex="-1">
    <div class="modal-dialog modal-fullscreen-sm-down modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-titulo">Pedido</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>
</div>

<!-- Modal: motivo nao entregue -->
<div class="modal fade" id="modal-motivo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Por que não entregou?</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-secondary text-start motivo-btn" data-motivo="ausente">Cliente ausente</button>
                    <button class="btn btn-outline-secondary text-start motivo-btn" data-motivo="recusou">Recusou o pedido</button>
                    <button class="btn btn-outline-secondary text-start motivo-btn" data-motivo="endereco_errado">Endereço errado / não localizado</button>
                    <button class="btn btn-outline-secondary text-start motivo-btn" data-motivo="outro">Outro motivo</button>
                </div>
                <textarea id="motivo-nota" class="form-control mt-3" rows="2" placeholder="Observação (opcional)"></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {
    var TOKEN_DRIVER = {{ token | tojson }};
    var DRIVER_ID = {{ driver.id }};
    var TEM_PIN = {{ 'true' if driver.pin else 'false' }};
    var CSRF = document.querySelector('meta[name=csrf-token]').content;

    var pedidoAtual = null; // referencia ao pedido sendo editado
    // "Marcar entregue" sem foto abriu a camera: quando a foto subir,
    // marca entregue automaticamente (fluxo foto-obrigatoria 01/08/2026).
    var marcarAposFoto = false;
    // Mesmo fluxo pro "Pular endereço" (08/08/2026): foto sobe → pula.
    var pularAposFoto = false;
    var pedidos = [];
    var origemEndereco = '';
    // Estado do "Iniciar rota" do dia (vem no /pedidos). Iniciar dispara o
    // e-mail "saiu para entrega" pros clientes da rota — 1x, idempotente.
    var rotaInfo = {iniciada: false, iniciada_em: null};

    function gerarLinksMaps(matriz, paradas) {
        if (!paradas || !paradas.length) return [];
        // Google Maps aceita 10 PONTOS no total (origem inclusa). Com a
        // matriz na frente, cabem só 9 paradas por link — bloco de 10
        // derrubava a última (testado pelo dono na rota de 11 paradas do
        // Dia dos Pais: o certo é 1-9 e 10-11).
        var links = [];
        var chunkSize = matriz ? 9 : 10;
        for (var i = 0; i < paradas.length; i += chunkSize) {
            var chunk = paradas.slice(i, i + chunkSize);
            var origem = matriz || chunk[0].endereco;
            var destino = chunk[chunk.length - 1].endereco;
            var ws;
            if (matriz) ws = chunk.slice(0, -1);
            else ws = chunk.slice(1, -1);
            var waypoints = ws.map(function(p) { return encodeURIComponent(p.endereco); }).join('|');
            var url = 'https://www.google.com/maps/dir/?api=1' +
                '&origin=' + encodeURIComponent(origem) +
                '&destination=' + encodeURIComponent(destino) +
                (waypoints ? '&waypoints=' + waypoints : '') +
                '&travelmode=driving';
            links.push({url: url, de: i + 1, ate: Math.min(i + chunkSize, paradas.length)});
        }
        return links;
    }

    function api(path, opts) {
        opts = opts || {};
        opts.headers = opts.headers || {};
        opts.headers['X-CSRFToken'] = CSRF;
        opts.credentials = 'same-origin';
        return fetch('/driver/api/' + TOKEN_DRIVER + path, opts).then(function(r) {
            return r.json().then(function(d) {
                // Sessao expirada (deploy do servidor invalidou cookies, etc) -> volta pra tela de PIN
                if (r.status === 401 && d && d.precisa_pin) {
                    mostrarLogin();
                }
                return {status: r.status, body: d};
            });
        });
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    // --- Login ---
    function mostrarLogin() {
        document.getElementById('login-screen').style.display = '';
        document.getElementById('app-screen').style.display = 'none';
        setTimeout(function() {
            document.getElementById('pin-input').focus();
        }, 200);
    }

    function mostrarApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = '';
        // Pula direto pra proxima data com entregas atribuidas pra esse driver.
        // Se falhar (rede etc), cai pra hoje (valor default do input).
        api('/proxima_data').then(function(r) {
            if (r.body && r.body.ok && r.body.data) {
                document.getElementById('data-input').value = r.body.data;
            }
            carregarPedidos();
        }).catch(carregarPedidos);
    }

    document.getElementById('btn-login').addEventListener('click', function() {
        var pin = document.getElementById('pin-input').value;
        api('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pin: pin}),
        }).then(function(r) {
            if (r.body.ok) {
                mostrarApp();
            } else {
                var e = document.getElementById('login-erro');
                e.textContent = r.body.erro || 'PIN incorreto';
                e.style.display = '';
            }
        });
    });
    document.getElementById('pin-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('btn-login').click();
    });

    // --- Lista de pedidos ---
    function carregarPedidos() {
        var data = document.getElementById('data-input').value;
        document.getElementById('loading').style.display = '';
        document.getElementById('pedidos-container').innerHTML = '';
        document.getElementById('vazio-msg').style.display = 'none';
        api('/pedidos?data=' + encodeURIComponent(data)).then(function(r) {
            document.getElementById('loading').style.display = 'none';
            if (r.status === 401 && r.body.precisa_pin) {
                mostrarLogin();
                return;
            }
            if (!r.body.ok) {
                document.getElementById('pedidos-container').innerHTML =
                    '<div class="alert alert-danger m-3">' + escapeHtml(r.body.erro || 'Erro') + '</div>';
                return;
            }
            pedidos = r.body.pedidos || [];
            origemEndereco = r.body.origem_endereco || '';
            rotaInfo = r.body.rota || {iniciada: false, iniciada_em: null};
            document.getElementById('topo-data').textContent =
                data.split('-').reverse().join('/') + ' — ' + pedidos.length + ' entrega' + (pedidos.length !== 1 ? 's' : '');
            renderPedidos();
        });
    }

    function renderPedidos() {
        var c = document.getElementById('pedidos-container');
        if (pedidos.length === 0) {
            document.getElementById('vazio-msg').style.display = '';
            c.innerHTML = '';
            return;
        }
        // Botao(s) de rota no Maps. Cada link cobre ate 10 paradas.
        var paradasComEndereco = pedidos.filter(function(p) { return p.endereco; });
        var links = gerarLinksMaps(origemEndereco, paradasComEndereco);
        var html = '';
        // 🚚 Iniciar rota: avisa os clientes por e-mail ("saiu para entrega")
        // e liga o acompanhamento ao vivo na pagina de cada pedido.
        if (rotaInfo.iniciada) {
            html += '<div class="alert alert-success py-2 m-2 mb-0 small">' +
                '<i class="bi bi-truck"></i> Rota iniciada' +
                (rotaInfo.iniciada_em ? ' às ' + escapeHtml(rotaInfo.iniciada_em) : '') +
                ' — clientes avisados.</div>';
        } else {
            html += '<div class="m-2 mb-0">' +
                '<button class="btn btn-warning btn-acao" id="btn-iniciar-rota">' +
                    '<i class="bi bi-truck"></i> Iniciar rota (avisa os clientes)</button>' +
                '<div class="text-muted small mt-1">Aperte quando SAIR pra rua: os clientes ' +
                'recebem o e-mail "saiu para entrega" e passam a acompanhar ao vivo.</div>' +
            '</div>';
        }
        if (links.length > 0) {
            html += '<div class="d-flex flex-wrap gap-2 mb-3">';
            links.forEach(function(l) {
                var label = links.length === 1
                    ? '<i class="bi bi-geo-alt-fill"></i> Abrir rota no Google Maps'
                    : '<i class="bi bi-geo-alt-fill"></i> Rota Maps (paradas ' + l.de + '-' + l.ate + ')';
                html += '<a href="' + l.url + '" target="_blank" rel="noopener" class="btn btn-success btn-sm flex-grow-1">' + label + '</a>';
            });
            html += '</div>';
        }
        for (var i = 0; i < pedidos.length; i++) {
            var p = pedidos[i];
            var st = p.status || 'pendente';
            var label = st === 'entregue' ? 'Entregue' : (st === 'nao_entregue' ? 'Não entregue' : 'Pendente');
            html += '<div class="pedido-card ' + st + '" data-idx="' + i + '">' +
                '<div class="d-flex justify-content-between align-items-start mb-1">' +
                    '<strong>' + (i + 1) + '. ' + escapeHtml(p.destinatario || '—') + '</strong>' +
                    '<span class="badge-status ' + st + '">' + label + '</span>' +
                '</div>' +
                '<div class="text-muted small"><i class="bi bi-geo-alt"></i> ' + escapeHtml(p.endereco || '') + '</div>' +
                (p.telefone ? '<div class="text-muted small"><i class="bi bi-telephone"></i> ' + escapeHtml(p.telefone) + '</div>' : '') +
                (p.periodo ? '<span class="badge bg-light text-dark mt-1" style="font-size:10px;"><i class="bi bi-clock"></i> ' + escapeHtml(p.periodo) + '</span> ' : '') +
                (st === 'pendente' && p.pulado_em
                    ? '<span class="badge bg-warning text-dark mt-1" style="font-size:10px;">⏭️ pulado às ' + escapeHtml(p.pulado_em) + ' — voltar depois</span>'
                    : '') +
                '<div class="mt-2 d-flex gap-2">' +
                    '<button class="btn btn-sm btn-outline-primary flex-grow-1 btn-detalhe" data-idx="' + i + '">' +
                        '<i class="bi bi-eye"></i> Abrir</button>' +
                '</div>' +
            '</div>';
        }
        c.innerHTML = html;
    }

    // Click "Abrir" / "Iniciar rota"
    document.getElementById('pedidos-container').addEventListener('click', function(e) {
        var ir = e.target.closest('#btn-iniciar-rota');
        if (ir) {
            var data = document.getElementById('data-input').value;
            var dataBr = data.split('-').reverse().join('/');
            if (!confirm('Iniciar a rota de ' + dataBr + ' agora? Todos os clientes da rota recebem o e-mail "saiu para entrega".')) return;
            ir.disabled = true;
            api('/iniciar-rota?data=' + encodeURIComponent(data), {method: 'POST'})
                .then(function(r) {
                    // Motorista trocou de data com o POST em voo: a resposta
                    // é da data ANTIGA — não pinta selo falso na nova.
                    var atual = document.getElementById('data-input').value;
                    if (r.body && r.body.ok) {
                        if (atual === data) {
                            rotaInfo = {iniciada: true, iniciada_em: r.body.iniciado_em};
                            renderPedidos();
                        }
                    } else {
                        ir.disabled = false;
                        alert((r.body && r.body.erro) || 'Erro ao iniciar a rota');
                    }
                })
                .catch(function() {
                    ir.disabled = false;
                    alert('Sem conexão — tente de novo.');
                });
            return;
        }
        var btn = e.target.closest('.btn-detalhe');
        if (!btn) return;
        var idx = parseInt(btn.dataset.idx, 10);
        abrirDetalhe(pedidos[idx]);
    });

    document.getElementById('data-input').addEventListener('change', carregarPedidos);

    // --- Detalhe ---
    function abrirDetalhe(p) {
        pedidoAtual = p;
        marcarAposFoto = false;   // modal novo = intencao antiga morre
        pularAposFoto = false;
        document.getElementById('modal-titulo').textContent = (p.destinatario || '—');
        var fotosHtml = '';
        if (p.fotos && p.fotos.length > 0) {
            fotosHtml = '<div class="foto-grid mt-2">';
            for (var i = 0; i < p.fotos.length; i++) {
                fotosHtml += '<div class="foto-wrap">' +
                    '<img src="' + escapeHtml(p.fotos[i].url) + '" class="foto-thumb">' +
                    '<span class="x" data-foto-id="' + p.fotos[i].id + '">×</span>' +
                '</div>';
            }
            fotosHtml += '</div>';
        }
        var enderecoEnc = encodeURIComponent(p.endereco || '');
        var html =
            '<div class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> ' + escapeHtml(p.endereco || '') + '</div>' +
            (p.telefone ? '<div class="mb-2"><a href="tel:' + escapeHtml(p.telefone) + '" class="btn btn-sm btn-outline-secondary"><i class="bi bi-telephone"></i> ' + escapeHtml(p.telefone) + '</a></div>' : '') +
            '<div class="mb-3"><a href="https://maps.google.com/?q=' + enderecoEnc + '" target="_blank" rel="noopener" class="btn btn-sm btn-outline-primary"><i class="bi bi-map"></i> Abrir no Maps</a></div>' +
            (p.periodo ? '<div class="mb-2"><span class="badge bg-light text-dark"><i class="bi bi-clock"></i> ' + escapeHtml(p.periodo) + '</span></div>' : '') +
            '<hr>' +
            '<label class="small fw-semibold">Fotos (' + (p.fotos || []).length + '/3)</label>' +
            fotosHtml +
            (p.fotos && p.fotos.length >= 3 ? '' :
                '<div class="mt-2">' +
                    '<input type="file" accept="image/*" capture="environment" id="foto-input" class="d-none">' +
                    '<button class="btn btn-outline-primary btn-acao" id="btn-tirar-foto"><i class="bi bi-camera"></i> Tirar foto</button>' +
                '</div>'
            ) +
            '<hr>' +
            '<label class="small fw-semibold">Observação</label>' +
            '<textarea id="nota-input" class="form-control" rows="2">' + escapeHtml(p.nota || '') + '</textarea>' +
            '<div class="d-grid gap-2 mt-3">' +
                '<button class="btn btn-success btn-acao" id="btn-entregue"><i class="bi bi-check-circle"></i> Marcar entregue</button>' +
                ((p.status || 'pendente') === 'pendente'
                    ? '<button class="btn btn-outline-warning btn-acao" id="btn-pular"><i class="bi bi-skip-forward"></i> Pular endereço (volto depois)</button>'
                    : '') +
                '<button class="btn btn-outline-danger btn-acao" id="btn-nao-entregue"><i class="bi bi-x-circle"></i> Não entregue</button>' +
            '</div>';
        document.getElementById('modal-body').innerHTML = html;

        var modal = new bootstrap.Modal(document.getElementById('modal-pedido'));
        modal.show();

        // Handlers dentro do modal
        var fInput = document.getElementById('foto-input');
        var btnFoto = document.getElementById('btn-tirar-foto');
        if (btnFoto) btnFoto.addEventListener('click', function() {
            // "Tirar foto" avulso mata intenção pendurada de entregar/pular
            // (achado de revisão: cancelar a câmera nem sempre dispara o
            // 'change' que reseta os flags — sem isso, a foto avulsa
            // executaria o pulo/entrega antiga sem confirmação).
            marcarAposFoto = false;
            pularAposFoto = false;
            fInput.click();
        });
        if (fInput) fInput.addEventListener('change', subirFoto);

        document.getElementById('btn-entregue').addEventListener('click', function() {
            // FOTO OBRIGATÓRIA (dono 01/08/2026): sem foto ainda, o botão
            // abre a CÂMERA direto — tirou a foto, o upload marca entregue
            // sozinho (ver subirFoto). Menos um toque pro motorista, e o
            // servidor recusa de qualquer jeito se vier sem foto (422).
            // Pós-PULO a foto da portaria não vale (precisa_foto_nova):
            // abre a câmera pra foto da entrega de verdade.
            if (!(pedidoAtual.fotos && pedidoAtual.fotos.length)
                    || pedidoAtual.precisa_foto_nova) {
                if (!fInput) {
                    // 3 fotos, todas de ANTES do pulo: o campo de câmera
                    // nem renderiza (cap 3) — sem este aviso o botão
                    // morreria em silêncio (achado de revisão).
                    alert('As fotos deste pedido são de antes do pulo e não '
                          + 'valem como comprovante da entrega. Apague uma '
                          + 'no × e tire a foto da entrega.');
                    return;
                }
                marcarAposFoto = true;
                fInput.click();
                return;
            }
            marcarStatus('entregue', null);
        });
        var btnPular = document.getElementById('btn-pular');
        if (btnPular) btnPular.addEventListener('click', function() {
            // Pular endereço (dono 08/08/2026): SÓ com foto provando que
            // esteve lá. Sem foto → câmera direto (o pulo acontece quando a
            // foto sobe — ver subirFoto). Com foto → confirma e pula.
            if (!(pedidoAtual.fotos && pedidoAtual.fotos.length)) {
                pularAposFoto = true;
                if (fInput) fInput.click();
                return;
            }
            if (!confirm('Pular este endereço? Ele vai pro FIM da sua rota '
                         + 'e você volta pra entregar depois.')) return;
            pularEndereco();
        });
        document.getElementById('btn-nao-entregue').addEventListener('click', function() {
            bootstrap.Modal.getInstance(document.getElementById('modal-pedido')).hide();
            new bootstrap.Modal(document.getElementById('modal-motivo')).show();
        });

    }

    // Deletar foto — delegado e registrado UMA vez (achado de revisão: o
    // listener era re-adicionado a cada abrirDetalhe e empilhava — apagar
    // uma foto depois de abrir N pedidos disparava N confirms/DELETEs).
    document.getElementById('modal-body').addEventListener('click', function(e) {
        var x = e.target.closest('.x[data-foto-id]');
        if (!x || !pedidoAtual) return;
        if (!confirm('Apagar essa foto?')) return;
        api('/foto/' + x.dataset.fotoId, {method: 'DELETE'}).then(function(r) {
            if (r.body.ok) {
                pedidoAtual.fotos = (pedidoAtual.fotos || []).filter(function(f) { return f.id != x.dataset.fotoId; });
                abrirDetalhe(pedidoAtual);
            }
        });
    });

    // Reduz a foto NO CELULAR antes de subir (dono 09/08/2026): a câmera
    // solta 3-8MB e o upload trava no 4G/celular fraco; 1400px + JPEG 0.8
    // fica legível (~200-400KB). FAIL-OPEN: qualquer erro (canvas, memória,
    // formato) manda o arquivo ORIGINAL — a foto nunca deixa de subir por
    // causa da redução. O servidor re-comprime de garantia.
    function reduzirFoto(arquivo) {
        return new Promise(function(resolve) {
            try {
                if (!window.createImageBitmap || !document.createElement('canvas').toBlob) {
                    resolve(arquivo); return;
                }
                createImageBitmap(arquivo).then(function(bmp) {
                    var MAX = 1400;
                    var esc = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
                    if (esc >= 1) { bmp.close && bmp.close(); resolve(arquivo); return; }
                    var cv = document.createElement('canvas');
                    cv.width = Math.round(bmp.width * esc);
                    cv.height = Math.round(bmp.height * esc);
                    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
                    bmp.close && bmp.close();
                    cv.toBlob(function(blob) {
                        resolve(blob && blob.size > 0 ? blob : arquivo);
                    }, 'image/jpeg', 0.8);
                }, function() { resolve(arquivo); });
            } catch (err) { resolve(arquivo); }
        });
    }

    function subirFoto(e) {
        var original = e.target.files[0];
        if (!original) { marcarAposFoto = false; pularAposFoto = false; return; }  // cancelou a camera
        reduzirFoto(original).then(function(arquivo) { subirFotoBlob(arquivo); });
    }

    function subirFotoBlob(arquivo) {
        var fd = new FormData();
        fd.append('foto', arquivo, 'foto.jpg');
        fd.append('atribuicao_id', pedidoAtual.atribuicao_id);
        fetch('/driver/api/' + TOKEN_DRIVER + '/foto', {
            method: 'POST',
            headers: {'X-CSRFToken': CSRF},
            credentials: 'same-origin',
            body: fd,
        }).then(function(r) { return r.json(); })
          .then(function(d) {
              if (d.ok) {
                  pedidoAtual.fotos = pedidoAtual.fotos || [];
                  pedidoAtual.fotos.push(d.foto);
                  // Foto recém-tirada é sempre POSTERIOR a um pulo antigo.
                  pedidoAtual.precisa_foto_nova = false;
                  // Atualiza no estado local
                  var p = pedidos.find(function(x) { return x.atribuicao_id === pedidoAtual.atribuicao_id; });
                  if (p) { p.fotos = pedidoAtual.fotos; p.precisa_foto_nova = false; }
                  if (marcarAposFoto) {
                      // Veio do "Marcar entregue": foto subiu, fecha o ciclo.
                      marcarAposFoto = false;
                      marcarStatus('entregue', null);
                      return;
                  }
                  if (pularAposFoto) {
                      // Veio do "Pular endereço": foto da fachada subiu, pula.
                      pularAposFoto = false;
                      pularEndereco();
                      return;
                  }
                  abrirDetalhe(pedidoAtual);
              } else {
                  marcarAposFoto = false;   // upload falhou: nao marca nada
                  pularAposFoto = false;
                  alert(d.erro || 'Falha ao enviar foto');
              }
          })
          .catch(function() {
              marcarAposFoto = false;
              pularAposFoto = false;
              alert('Sem conexão — tente a foto de novo.');
          });
    }

    function pularEndereco() {
        api('/pular', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                atribuicao_id: pedidoAtual.atribuicao_id,
                nota: (document.getElementById('nota-input') || {}).value || '',
            }),
        }).then(function(r) {
            if (r.body && r.body.ok) {
                var m1 = bootstrap.Modal.getInstance(document.getElementById('modal-pedido'));
                if (m1) m1.hide();
                // Re-busca a lista: o pedido reaparece no FIM da rota, com
                // o selo "pulado" — e o motorista segue pro próximo.
                carregarPedidos();
            } else {
                alert((r.body && r.body.erro) || 'Erro ao pular');
            }
        }).catch(function() { alert('Sem conexão — tente de novo.'); });
    }

    function marcarStatus(status, motivo) {
        var nota = (document.getElementById('nota-input') || {}).value || '';
        var motivoNota = (document.getElementById('motivo-nota') || {}).value || '';

        // Pede geo se status = entregue
        var geoP = Promise.resolve(null);
        if (status === 'entregue' && navigator.geolocation) {
            geoP = new Promise(function(res) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) { res({lat: pos.coords.latitude, lng: pos.coords.longitude}); },
                    function() { res(null); },
                    {timeout: 5000, maximumAge: 60000}
                );
            });
        }

        geoP.then(function(geo) {
            api('/status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    atribuicao_id: pedidoAtual.atribuicao_id,
                    status: status,
                    nota: status === 'nao_entregue' ? motivoNota : nota,
                    motivo_falha: motivo,
                    geo: geo,
                }),
            }).then(function(r) {
                if (r.body.ok) {
                    pedidoAtual.status = status;
                    pedidoAtual.proof_hash = r.body.proof_hash;
                    var p = pedidos.find(function(x) { return x.atribuicao_id === pedidoAtual.atribuicao_id; });
                    if (p) { p.status = status; p.proof_hash = r.body.proof_hash; }
                    renderPedidos();
                    var m1 = bootstrap.Modal.getInstance(document.getElementById('modal-pedido'));
                    if (m1) m1.hide();
                    var m2 = bootstrap.Modal.getInstance(document.getElementById('modal-motivo'));
                    if (m2) m2.hide();
                } else {
                    alert(r.body.erro || 'Erro');
                }
            });
        });
    }

    // Motivos
    document.querySelectorAll('.motivo-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            marcarStatus('nao_entregue', btn.dataset.motivo);
        });
    });

    // --- Boot ---
    if (TEM_PIN) {
        // Tenta carregar — se 401, mostra login
        api('/pedidos').then(function(r) {
            if (r.status === 401 && r.body.precisa_pin) {
                mostrarLogin();
            } else {
                mostrarApp();
            }
        });
    } else {
        mostrarApp();
    }
})();
</script>
</body>
</html>
