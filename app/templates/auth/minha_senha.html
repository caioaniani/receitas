{% extends "base.html" %}

{% block title %}Trocar minha senha{% endblock %}

{% block content %}
<h1 class="page-title mb-3"><i class="bi bi-key"></i> Trocar minha senha</h1>

<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Senha atual</label>
                <input type="password" name="senha_atual" class="form-control"
                       required autofocus autocomplete="current-password">
            </div>

            <div class="mb-3">
                <label class="form-label">Nova senha</label>
                <input type="password" name="nova_senha" class="form-control"
                       required minlength="8" autocomplete="new-password">
                <div class="form-text">Mínimo 8 caracteres.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar nova senha</label>
                <input type="password" name="confirma_senha" class="form-control"
                       required minlength="8" autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Alterar senha
            </button>
            <a href="{{ url_for('main.index') }}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
