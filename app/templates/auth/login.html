<!DOCTYPE html>
<html lang="pt-BR">
<script>
(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Padaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}?v={{ static_v['css/style.css'] }}" rel="stylesheet">
    <style>
        body {
            background: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2.25rem;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }
        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-header h4 {
            margin: 0;
            color: var(--cor-azul);
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.02em;
            text-transform: lowercase;
        }
        .login-header .login-sub {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
            text-transform: lowercase;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h4>padaria</h4>
            <div class="login-sub">sistema de gestão</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label small">usuário ou e-mail</label>
                <input type="text" name="login" class="form-control"
                       placeholder="seu usuário ou e-mail"
                       value="{{ request.form.get('login', '') }}"
                       autocomplete="username" autocapitalize="none"
                       autocorrect="off" spellcheck="false" inputmode="email"
                       required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small">senha</label>
                <input type="password" name="senha" class="form-control"
                       placeholder="sua senha" autocomplete="current-password"
                       autocapitalize="none" autocorrect="off"
                       spellcheck="false" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> entrar
            </button>
        </form>
    </div>
</body>
</html>
