<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel + Atendimento</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: #1f2933;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .barra-teste {
    flex: 0 0 auto; background: #b02a37; color: #fff; font-size: 13px;
    padding: 5px 12px; display: flex; align-items: center; gap: 12px;
  }
  .barra-teste .tag {
    background: #fff; color: #b02a37; font-weight: 700; border-radius: 3px;
    padding: 1px 7px; font-size: 11px; letter-spacing: .5px;
  }
  .barra-teste a { color: #fff; text-decoration: underline; }
  .barra-teste .dir { margin-left: auto; opacity: .9; }
  .bt-arm {
    background: #198754; color: #fff; border: 0; padding: 3px 12px;
    border-radius: 3px; font-weight: 700; cursor: pointer; font-size: 12px;
  }
  .bt-arm.armado { background: #495057; }
  .badge-cw {
    background: #ffd43b; color: #1f2933; padding: 3px 10px; border-radius: 3px;
    font-weight: 700; font-size: 12px; cursor: pointer;
    animation: pulsa-cw 1s infinite;
  }
  @keyframes pulsa-cw {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,212,59,.7); }
    50% { box-shadow: 0 0 0 8px rgba(255,212,59,0); }
  }

  .split { flex: 1 1 auto; display: flex; min-height: 0; }
  .pane { height: 100%; min-width: 0; position: relative; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; }
  #pane-painel { flex: 0 0 60%; }
  #pane-chat { flex: 1 1 auto; background: #f8f9fa; display: flex; flex-direction: column; }

  .divisor {
    flex: 0 0 7px; background: #495057; cursor: col-resize;
    display: flex; align-items: center; justify-content: center;
  }
  .divisor::before { content: "⋮"; color: #adb5bd; font-size: 16px; }
  .divisor:hover { background: #0d6efd; }
  body.dragging iframe { pointer-events: none; }
  body.dragging { user-select: none; cursor: col-resize; }

  /* ── Widget de atendimento ── */
  .at-topo {
    flex: 0 0 auto; background: #212529; color: #fff;
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  }
  .at-topo .titulo { font-weight: 700; font-size: 14px; }
  .at-topo .filtros { display: flex; gap: 4px; margin-left: auto; }
  .at-topo .filtros button {
    background: #343a40; color: #ced4da; border: 0; border-radius: 3px;
    padding: 2px 9px; font-size: 12px; cursor: pointer;
  }
  .at-topo .filtros button.on { background: #0d6efd; color: #fff; }
  .at-topo .att { font-size: 11px; opacity: .6; }

  .at-corpo { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  .conv {
    display: flex; align-items: flex-start; gap: 8px; padding: 9px 11px;
    border-bottom: 1px solid #e9ecef; cursor: pointer; background: #fff;
  }
  .conv:hover { background: #eef2ff; }
  .conv .av {
    flex: 0 0 34px; height: 34px; border-radius: 50%; background: #ced4da;
    color: #495057; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .conv .meio { flex: 1 1 auto; min-width: 0; }
  .conv .nome { font-weight: 600; font-size: 13px; color: #212529;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .prev { font-size: 12px; color: #6c757d;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .lado { flex: 0 0 auto; text-align: right; }
  .conv .quando { font-size: 11px; color: #adb5bd; }
  .conv .badge-pend {
    display: inline-block; margin-top: 3px; background: #d6336c; color: #fff;
    border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 700;
  }
  .at-vazio { padding: 24px; text-align: center; color: #adb5bd; font-size: 13px; }

  /* ── Thread ── */
  .thread-topo {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; background: #e9ecef; border-bottom: 1px solid #dee2e6;
  }
  .thread-topo button {
    background: #fff; border: 1px solid #ced4da; border-radius: 4px;
    padding: 2px 9px; cursor: pointer; font-size: 13px;
  }
  .thread-topo .nome { font-weight: 700; font-size: 14px; }
  .thread-corpo { flex: 1 1 auto; overflow-y: auto; padding: 10px; min-height: 0; }
  .bolha {
    max-width: 80%; padding: 7px 10px; border-radius: 10px; margin-bottom: 8px;
    font-size: 13px; line-height: 1.35; white-space: pre-wrap; word-wrap: break-word;
  }
  .bolha.cli { background: #fff; border: 1px solid #dee2e6; }
  .bolha.nos { background: #d0ebff; margin-left: auto; }
  .bolha .qd { display: block; font-size: 10px; color: #868e96; margin-top: 3px; }
  .bolha img { max-width: 100%; border-radius: 6px; margin-top: 4px; }
  .hidden { display: none !important; }

  /* ── Caixa de resposta + acoes ── */
  .thread-acoes { display: flex; gap: 6px; margin-left: auto; }
  .thread-acoes button {
    background: #fff; border: 1px solid #ced4da; border-radius: 4px;
    padding: 2px 8px; cursor: pointer; font-size: 12px;
  }
  .thread-acoes button.danger { color: #b02a37; border-color: #f1aeb5; }
  .thread-acoes button.ok { color: #198754; border-color: #a3cfbb; }
  .thread-acoes button:hover { background: #f8f9fa; }
  .thread-acoes button:disabled { opacity: .5; cursor: wait; }

  .compose {
    flex: 0 0 auto; border-top: 1px solid #dee2e6; background: #fff;
    padding: 8px; display: flex; gap: 6px; align-items: flex-end;
  }
  .compose textarea {
    flex: 1 1 auto; min-height: 38px; max-height: 120px; resize: none;
    border: 1px solid #ced4da; border-radius: 6px; padding: 7px 9px;
    font: inherit; font-size: 13px; outline: none;
  }
  .compose textarea:focus { border-color: #0d6efd; }
  .compose .enviar {
    background: #0d6efd; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 14px; font-weight: 700; cursor: pointer; font-size: 13px;
  }
  .compose .enviar:hover { background: #0b5ed7; }
  .compose .enviar:disabled { background: #adb5bd; cursor: wait; }
  .compose .dica {
    font-size: 10px; color: #adb5bd; align-self: center; padding: 0 4px;
  }

  .toast {
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    background: #212529; color: #fff; padding: 9px 14px; border-radius: 6px;
    font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.25);
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.erro { background: #b02a37; }
  .toast.ok { background: #198754; }
</style>
</head>
<body>
  <div class="barra-teste">
    <span class="tag">PAINEL</span>
    <span>Pedidos do dia + Atendimento (Chatwoot via API).</span>
    <button id="btn-arm" type="button" class="bt-arm">▶ LIGAR ALERTAS</button>
    <span id="badge-cw" class="badge-cw" hidden>
      <span id="badge-cw-n">0</span> nova(s) — clique para silenciar
    </span>
    <span class="dir">
      <a href="{{ url_for('entregas.painel') }}">abrir painel normal</a>
    </span>
  </div>

  <div id="toast" class="toast"></div>

  <div class="split" id="split">
    <div class="pane" id="pane-painel">
      <iframe src="{{ url_for('entregas.painel') }}?embed=1"
              title="Painel de entregas"></iframe>
    </div>
    <div class="divisor" id="divisor" title="Arraste para ajustar a proporção"></div>

    <div class="pane" id="pane-chat">
      <div class="at-topo">
        <span class="titulo"><i></i> Atendimento</span>
        <span class="filtros">
          <button type="button" data-status="open" class="on">Abertas</button>
          <button type="button" data-status="pending">Aguardando</button>
        </span>
        <span class="att" id="at-att"></span>
      </div>

      <!-- Lista de conversas -->
      <div class="at-corpo" id="at-lista">
        <div class="at-vazio">Carregando…</div>
      </div>

      <!-- Thread de uma conversa (escondida até clicar) -->
      <div class="at-corpo hidden" id="at-thread" style="display:flex;flex-direction:column;">
        <div class="thread-topo">
          <button type="button" id="thread-voltar">← Voltar</button>
          <span class="nome" id="thread-nome"></span>
          <span class="thread-acoes">
            <button type="button" id="acao-pending" title="Devolver pro bot">↩ Bot</button>
            <button type="button" id="acao-open" title="Passar pro atendimento humano">👤 Humano</button>
            <button type="button" id="acao-resolved" class="ok" title="Marcar como resolvida">✓ Resolver</button>
          </span>
        </div>
        <div class="thread-corpo" id="thread-corpo"></div>
        <div class="compose">
          <textarea id="compose-texto" placeholder="Escreva sua resposta… (Enter envia, Shift+Enter quebra linha)"
                    rows="1" maxlength="4000"></textarea>
          <button type="button" id="compose-enviar" class="enviar">Enviar</button>
        </div>
      </div>
    </div>
  </div>

<script>
  var CSRF = "{{ csrf_token() }}";
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function postJSON(url, body) {
    return fetch(url, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
      body: JSON.stringify(body || {}),
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; })
        .catch(function () { return { status: r.status, body: {} }; });
    });
  }
  var _toastT;
  function toast(msg, tipo) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.className = 'toast show ' + (tipo || '');
    t.textContent = msg;
    clearTimeout(_toastT);
    _toastT = setTimeout(function () { t.className = 'toast'; }, 3500);
  }
  function tempoRel(epoch) {
    if (!epoch) return '';
    var seg = Math.floor(Date.now()/1000 - Number(epoch));
    if (seg < 60) return 'agora';
    if (seg < 3600) return Math.floor(seg/60) + 'min';
    if (seg < 86400) return Math.floor(seg/3600) + 'h';
    return Math.floor(seg/86400) + 'd';
  }

  // ── Divisor arrastavel ──
  (function () {
    var split = document.getElementById('split');
    var pane = document.getElementById('pane-painel');
    var divisor = document.getElementById('divisor');
    var arrastando = false;
    divisor.addEventListener('mousedown', function (e) {
      arrastando = true; document.body.classList.add('dragging'); e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (!arrastando) return;
      var rect = split.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width * 100;
      pct = Math.max(20, Math.min(80, pct));
      pane.style.flex = '0 0 ' + pct + '%';
    });
    window.addEventListener('mouseup', function () {
      if (!arrastando) return;
      arrastando = false; document.body.classList.remove('dragging');
    });
  })();

  // ── Painel de atendimento (lista + thread, read-only) ──
  (function () {
    var statusAtual = 'open';
    var convAtual = null;          // id da conversa aberta na thread
    var lista = document.getElementById('at-lista');
    var thread = document.getElementById('at-thread');
    var threadCorpo = document.getElementById('thread-corpo');
    var threadNome = document.getElementById('thread-nome');
    var att = document.getElementById('at-att');
    var compose = document.getElementById('compose-texto');
    var btnEnviar = document.getElementById('compose-enviar');

    document.querySelectorAll('.at-topo .filtros button').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.at-topo .filtros button')
          .forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        statusAtual = b.dataset.status;
        carregarLista();
      });
    });
    document.getElementById('thread-voltar').addEventListener('click', function () {
      thread.classList.add('hidden');
      lista.classList.remove('hidden');
    });

    function carregarLista() {
      fetch('/entregas/api/atendimento/conversas?status=' + statusAtual,
            {credentials: 'same-origin'})
        .then(function (r) { return r.ok ? r.json() : {conversas: []}; })
        .then(function (data) {
          var cs = (data && data.conversas) || [];
          att.textContent = 'atualizado ' + tempoRel(Math.floor(Date.now()/1000));
          if (!cs.length) {
            lista.innerHTML = '<div class="at-vazio">Nenhuma conversa ' +
              (statusAtual === 'pending' ? 'aguardando' : 'aberta') + ' agora.</div>';
            return;
          }
          lista.innerHTML = cs.map(function (c) {
            var ini = (c.contato || '?').trim().charAt(0).toUpperCase();
            var pend = c.status === 'pending'
              ? '<span class="badge-pend">aguardando</span>' : '';
            return '<div class="conv" data-id="' + c.id + '" data-nome="' +
              esc(c.contato) + '">' +
              '<div class="av">' + esc(ini) + '</div>' +
              '<div class="meio"><div class="nome">' + esc(c.contato) + '</div>' +
              '<div class="prev">' + esc(c.preview || '(sem mensagem)') + '</div></div>' +
              '<div class="lado"><div class="quando">' + tempoRel(c.ultima_em) + '</div>' +
              pend + '</div></div>';
          }).join('');
          lista.querySelectorAll('.conv').forEach(function (el) {
            el.addEventListener('click', function () {
              abrirThread(el.dataset.id, el.dataset.nome);
            });
          });
        })
        .catch(function () { /* rede: mantem o que tinha */ });
    }

    function abrirThread(id, nome) {
      convAtual = id;
      threadNome.textContent = nome || ('Conversa ' + id);
      threadCorpo.innerHTML = '<div class="at-vazio">Carregando…</div>';
      lista.classList.add('hidden');
      thread.classList.remove('hidden');
      compose.value = '';
      compose.style.height = 'auto';
      fetch('/entregas/api/atendimento/conversa/' + id, {credentials: 'same-origin'})
        .then(function (r) { return r.ok ? r.json() : {mensagens: []}; })
        .then(function (data) {
          var ms = (data && data.mensagens) || [];
          if (!ms.length) {
            threadCorpo.innerHTML = '<div class="at-vazio">Sem mensagens.</div>';
            return;
          }
          threadCorpo.innerHTML = ms.map(function (m) {
            var cls = m.role === 'user' ? 'cli' : 'nos';
            var quem = m.role === 'user' ? esc(nome || 'Cliente') : 'Nós';
            var imgs = (m.imagens || []).map(function (u) {
              return '<img src="' + esc(u) + '" alt="anexo">';
            }).join('');
            return '<div class="bolha ' + cls + '">' + esc(m.content) + imgs +
              '<span class="qd">' + quem + '</span></div>';
          }).join('');
          threadCorpo.scrollTop = threadCorpo.scrollHeight;
        })
        .catch(function () {
          threadCorpo.innerHTML = '<div class="at-vazio">Erro ao carregar.</div>';
        });
    }

    // ── Enviar mensagem ──
    function enviar() {
      if (!convAtual) return;
      var texto = (compose.value || '').trim();
      if (!texto) { compose.focus(); return; }
      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando…';
      postJSON('/entregas/api/atendimento/conversa/' + convAtual + '/enviar',
               { content: texto })
        .then(function (r) {
          btnEnviar.disabled = false;
          btnEnviar.textContent = 'Enviar';
          if (r.status === 200 && r.body && r.body.ok) {
            compose.value = '';
            compose.style.height = 'auto';
            toast('Mensagem enviada', 'ok');
            // recarrega a thread pra mostrar a propria msg
            abrirThread(convAtual, threadNome.textContent);
          } else {
            toast('Erro ao enviar: ' + ((r.body && r.body.erro) || r.status), 'erro');
          }
        })
        .catch(function () {
          btnEnviar.disabled = false;
          btnEnviar.textContent = 'Enviar';
          toast('Falha de rede', 'erro');
        });
    }
    btnEnviar.addEventListener('click', enviar);
    // Enter envia, Shift+Enter quebra linha. IME (acentos lentos) respeitado:
    // se isComposing=true, Enter NAO envia (deixa o teclado virtual confirmar).
    compose.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        enviar();
      }
    });
    // Auto-resize: cresce conforme o usuario digita ate o max-height do CSS.
    compose.addEventListener('input', function () {
      compose.style.height = 'auto';
      compose.style.height = Math.min(compose.scrollHeight, 120) + 'px';
    });

    // ── Acoes (status) ──
    function mudarStatus(novoStatus, msgOk, confirmacao) {
      if (!convAtual) return;
      if (confirmacao && !confirm(confirmacao)) return;
      postJSON('/entregas/api/atendimento/conversa/' + convAtual + '/status',
               { status: novoStatus })
        .then(function (r) {
          if (r.status === 200 && r.body && r.body.ok) {
            toast(msgOk, 'ok');
            // volta pra lista — a conversa nao esta mais no status atual
            thread.classList.add('hidden');
            lista.classList.remove('hidden');
            carregarLista();
          } else {
            toast('Erro: ' + ((r.body && r.body.erro) || r.status), 'erro');
          }
        })
        .catch(function () { toast('Falha de rede', 'erro'); });
    }
    document.getElementById('acao-pending').addEventListener('click', function () {
      mudarStatus('pending', 'Devolvida pro bot');
    });
    document.getElementById('acao-open').addEventListener('click', function () {
      mudarStatus('open', 'Marcada como humano atendendo');
    });
    document.getElementById('acao-resolved').addEventListener('click', function () {
      mudarStatus('resolved', 'Conversa resolvida',
                  'Marcar esta conversa como resolvida?');
    });

    carregarLista();
    // Atualiza a lista a cada 20s, mas SO quando a thread nao esta aberta
    // (pra nao puxar o tapete de quem esta lendo uma conversa).
    setInterval(function () {
      if (thread.classList.contains('hidden')) carregarLista();
    }, 20000);
  })();

  // ── Klaxon de nova conversa (pending) ──
  (function () {
    var armado = false, audioCtx = null, vistos = null, klaxonTimer = null;
    var btnArm = document.getElementById('btn-arm');
    var badge = document.getElementById('badge-cw');
    var badgeN = document.getElementById('badge-cw-n');

    function klaxon() {
      if (!audioCtx) return;
      var now = audioCtx.currentTime;
      [440, 660, 440].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(audioCtx.destination);
        var t = now + i * 0.22;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        osc.start(t); osc.stop(t + 0.24);
      });
    }
    function ligarKlaxon() { if (!klaxonTimer) { klaxon(); klaxonTimer = setInterval(klaxon, 1600); } }
    function desligarKlaxon() { if (klaxonTimer) { clearInterval(klaxonTimer); klaxonTimer = null; } }

    btnArm.addEventListener('click', function () {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
      armado = true;
      btnArm.textContent = '✓ alertas ligados';
      btnArm.classList.add('armado');
      poll();
    });
    badge.addEventListener('click', function () { desligarKlaxon(); badge.hidden = true; });

    function poll() {
      fetch('{{ url_for("entregas.api_painel_testes_chatwoot_pending") }}',
            {credentials: 'same-origin'})
        .then(function (r) { return r.ok ? r.json() : {ids: []}; })
        .then(function (data) {
          var ids = (data && data.ids) || [];
          if (vistos === null) { vistos = new Set(ids); return; }
          var novos = ids.filter(function (id) { return !vistos.has(id); });
          ids.forEach(function (id) { vistos.add(id); });
          if (novos.length > 0 && armado) {
            badgeN.textContent = novos.length; badge.hidden = false; ligarKlaxon();
          }
        })
        .catch(function () {});
    }
    setInterval(function () { if (armado) poll(); }, 20000);
  })();
</script>
</body>
</html>
