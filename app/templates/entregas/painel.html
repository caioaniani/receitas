<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de Hoje</title>
<style>
  :root {
    --novo: #d6336c; --novo-bg: #fff0f4;
    --visto: #f59f00; --visto-bg: #fff9db;
    --pronto: #2b8a3e; --pronto-bg: #ebfbee;
    --expr: #e8590c;
  }
  * { box-sizing: border-box; }
  body { background: #e9ecef; margin: 0; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }

  .topo {
    position: sticky; top: 0; z-index: 10; background: #1f2933; color: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; gap: 12px;
  }
  .topo h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: .5px; }
  .topo .data { font-size: 13px; opacity: .85; }
  .badge-novos { background: var(--novo); color: #fff; font-weight: 800; padding: 5px 13px;
    border-radius: 999px; font-size: 17px; display: none; }
  .badge-novos.on { display: inline-block; animation: pisca 1s infinite; }
  .relogio { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .conexao { width: 11px; height: 11px; border-radius: 50%; background: #2b8a3e; }
  .conexao.off { background: #e03131; }

  /* Quadro: colunas por janela de horario, com scroll horizontal */
  .quadro { display: flex; gap: 14px; padding: 16px; overflow-x: auto; align-items: flex-start;
    min-height: calc(100vh - 120px); }
  .coluna { flex: 0 0 300px; background: #f1f3f5; border-radius: 14px; padding: 10px;
    display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 130px); }
  .coluna > h2 { font-size: 17px; font-weight: 800; margin: 4px 6px 2px; color: #343a40;
    display: flex; align-items: center; justify-content: space-between; }
  .coluna .conta { font-size: 14px; color: #868e96; font-weight: 700; }
  .coluna .lista { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 2px; }
  .coluna.expr { background: #fff4e6; }
  .coluna.expr > h2 { color: var(--expr); }
  .coluna.entregues { background: #e3e8ef; }
  .coluna.entregues > h2 { color: #495057; }

  .cartao { background: #fff; border-radius: 12px; padding: 14px; cursor: pointer;
    border-left: 8px solid #ced4da; box-shadow: 0 1px 4px rgba(0,0,0,.08); transition: transform .08s; }
  .cartao:active { transform: scale(.98); }
  .cartao .nome { font-size: 19px; font-weight: 800; color: #1f2933; line-height: 1.15; }
  .cartao .end { font-size: 13px; color: #868e96; margin-top: 2px; }
  .cartao .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .cartao .qtd { font-size: 13px; color: #868e96; }
  .cartao .selo { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }

  .cartao.novo { border-left-color: var(--novo); background: var(--novo-bg); animation: pisca-borda 1.1s infinite; }
  .cartao.novo .selo { background: var(--novo); color: #fff; }
  .cartao.visto { border-left-color: var(--visto); background: var(--visto-bg); }
  .cartao.visto .selo { background: var(--visto); color: #fff; }
  .cartao.pronto { border-left-color: var(--pronto); background: var(--pronto-bg); }
  .cartao.pronto .selo { background: var(--pronto); color: #fff; }
  .cartao.entregue { opacity: .6; border-left-color: #adb5bd; }
  .cartao.entregue .selo { background: #adb5bd; color: #fff; }

  @keyframes pisca { 50% { opacity: .35; } }
  @keyframes pisca-borda { 0%,100% { box-shadow: -4px 0 0 0 rgba(214,51,108,.5); } 50% { box-shadow: -4px 0 0 4px rgba(214,51,108,0); } }

  .arm { position: fixed; inset: 0; z-index: 50; background: #1f2933; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; }
  .arm h2 { font-size: 28px; font-weight: 800; margin: 0 0 10px; }
  .arm p { font-size: 17px; opacity: .8; max-width: 440px; }
  .arm button { margin-top: 24px; font-size: 24px; font-weight: 800; background: #2b8a3e; color: #fff;
    border: 0; border-radius: 16px; padding: 20px 44px; cursor: pointer; }

  .detalhe { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: none;
    align-items: center; justify-content: center; padding: 14px; }
  .detalhe.on { display: flex; }
  .detalhe-box { background: #fff; border-radius: 18px; width: 100%; max-width: 600px; max-height: 92vh;
    overflow-y: auto; padding: 22px; }
  .d-nome { font-size: 26px; font-weight: 800; color: #1f2933; }
  .d-end { font-size: 17px; color: #52606d; margin: 6px 0 2px; }
  .d-tel { font-size: 17px; color: #52606d; }
  .d-janela { display: inline-block; margin-top: 8px; font-size: 15px; font-weight: 800;
    padding: 4px 12px; border-radius: 999px; background: #e7f5ff; color: #1971c2; }
  .d-janela.expr { background: #fff4e6; color: var(--expr); }
  .cartinha-bloco { margin: 16px 0; padding: 18px; border-radius: 14px; background: #fff9db; border: 2px dashed #f0c000; }
  .cartinha-bloco .lbl { font-size: 14px; font-weight: 800; color: #b8860b; text-transform: uppercase; letter-spacing: 1px; }
  .cartinha-bloco .txt { font-size: 25px; line-height: 1.4; color: #1f2933; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .cartinha-bloco.vazia { background: #f1f3f5; border-color: #ced4da; }
  .lala-box { margin: 14px 0; padding: 14px; border-radius: 14px; background: #fff4e6; border: 2px solid #ff9f1a; }
  .lala-st { font-size: 19px; }
  .lala-mot { font-size: 17px; margin-top: 4px; }
  .lala-link { font-size: 18px; font-weight: 700; color: #1565c0; }
  .lala-end { width: 100%; font-size: 17px; padding: 8px 10px; margin: 8px 0 2px;
              border: 1px solid #e0a23f; border-radius: 8px; background: #fff; }
  .lala-veic { margin: 10px 0; }
  .lala-veic select { font-size: 19px; padding: 10px 12px; border-radius: 10px;
                      border: 1px solid #e0a23f; background: #fff; width: 100%; }
  .lala-res { font-size: 22px; min-height: 28px; margin: 6px 0; }
  .lala-erro { color: #c92a2a; font-size: 16px; }
  .lala-btn { font-size: 18px; font-weight: 800; padding: 12px 18px; border-radius: 12px;
              border: 0; background: #ff9f1a; color: #fff; cursor: pointer; margin-right: 8px; margin-top: 4px; }
  .lala-btn.chamar { background: #2b8a3e; }
  .lala-btn.cancelar { background: #c92a2a; }
  .cartinha-bloco.vazia .txt { font-size: 17px; color: #868e96; font-style: italic; }
  .itens-lista .item { font-size: 18px; padding: 5px 0; border-bottom: 1px solid #eee; }
  .itens-lista .item b { font-size: 20px; }
  .acoes { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .acoes button { flex: 1 1 0; min-width: 130px; font-size: 19px; font-weight: 800; border: 0;
    border-radius: 14px; padding: 16px; cursor: pointer; color: #fff; }
  .btn-pronto { background: var(--pronto); }
  .btn-entregue { background: #1971c2; }
  .btn-voltar { background: #adb5bd; }
  .btn-fechar { width: 100%; margin-top: 10px; font-size: 18px; font-weight: 700; background: #f1f3f5;
    color: #495057; border: 0; border-radius: 12px; padding: 14px; cursor: pointer; }

  .vazio { text-align: center; padding: 60px 20px; color: #868e96; font-size: 20px; width: 100%; }
  .erro-banner { background: #fff3bf; color: #5c3c00; text-align: center; padding: 9px; font-size: 14px; display: none; }
  .erro-banner.on { display: block; }
</style>
</head>
<body>
<div class="arm" id="arm">
  <h2>🔔 Painel de Pedidos</h2>
  <p>Toque para ligar o painel e o som de aviso. Deixe esta tela aberta o dia todo.</p>
  <button id="btn-arm" type="button">▶ LIGAR PAINEL</button>
</div>

<div class="topo">
  <div><h1>PEDIDOS DE HOJE</h1><div class="data" id="data-hoje"></div></div>
  <span class="badge-novos" id="badge-novos">0 novos</span>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="relogio" id="relogio">--:--</span>
    <span class="conexao" id="conexao" title="conexão"></span>
  </div>
</div>

<div class="erro-banner" id="erro-banner"></div>
<div class="quadro" id="quadro"></div>

<div class="detalhe" id="detalhe"><div class="detalhe-box" id="detalhe-box"></div></div>

<script>
(function () {
  var ENDPOINT = "{{ url_for('entregas.api_painel') }}";
  var STATUS_TMPL = "{{ url_for('entregas.api_painel_status', code='__CODE__') }}";
  var LALA_COTAR = "{{ url_for('entregas.api_lalamove_cotar') }}";
  var LALA_CHAMAR = "{{ url_for('entregas.api_lalamove_chamar') }}";
  var LALA_CANCELAR = "{{ url_for('entregas.api_lalamove_cancelar') }}";
  var LALA_VEICULOS = {{ (lala_veiculos or []) | tojson }};
  var CSRF = "{{ csrf_token() }}";
  var pedidos = [];
  var audioCtx = null, beepTimer = null;
  var abertoCode = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Som ───────────────────────────────────────────────
  function armAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function beep() {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    [880, 1320].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      var t = now + i * 0.18;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      osc.start(t); osc.stop(t + 0.2);
    });
  }
  function ligarAlarme() { if (!beepTimer) { beep(); beepTimer = setInterval(beep, 2000); } }
  function desligarAlarme() { if (beepTimer) { clearInterval(beepTimer); beepTimer = null; } }
  function atualizarAlarme() {
    var novos = pedidos.filter(function (p) { return p.status === 'novo'; }).length;
    var badge = document.getElementById('badge-novos');
    badge.textContent = novos + (novos === 1 ? ' NOVO' : ' NOVOS');
    badge.classList.toggle('on', novos > 0);
    if (novos > 0) ligarAlarme(); else desligarAlarme();
  }

  // ── Agrupamento por janela ────────────────────────────
  function horaInicio(periodo) {
    var m = String(periodo || '').match(/(\d{1,2})/);
    return m ? parseInt(m[1], 10) : 99;
  }
  function selo(status) {
    return status === 'pronto' ? 'PRONTO' : status === 'visto' ? 'EM PREPARO'
         : status === 'entregue' ? 'ENTREGUE' : 'NOVO';
  }

  function colunas() {
    var ativos = pedidos.filter(function (p) { return p.status !== 'entregue'; });
    var entregues = pedidos.filter(function (p) { return p.status === 'entregue'; });
    var cols = [];

    // 1) Expresso
    var expr = ativos.filter(function (p) { return p.expresso; });
    if (expr.length) cols.push({ titulo: '⚡ EXPRESSO (1h)', cls: 'expr', itens: expr });

    // 2) Janelas de horario (nao-expresso), ordenadas pela hora de inicio
    var porJanela = {};
    ativos.filter(function (p) { return !p.expresso; }).forEach(function (p) {
      var j = (p.periodo || '').trim() || 'Sem horário';
      (porJanela[j] = porJanela[j] || []).push(p);
    });
    Object.keys(porJanela).sort(function (a, b) {
      return horaInicio(a) - horaInicio(b) || a.localeCompare(b);
    }).forEach(function (j) {
      cols.push({ titulo: '🕐 ' + j, cls: '', itens: porJanela[j] });
    });

    // 3) Entregues do dia
    if (entregues.length) cols.push({ titulo: '✓ ENTREGUES', cls: 'entregues', itens: entregues });
    return cols;
  }

  function cartaoHTML(p) {
    var nItens = (p.itens || []).reduce(function (s, it) { return s + (Number(it.qtd) || 1); }, 0);
    return '<div class="cartao ' + p.status + '" data-code="' + esc(p.code) + '">' +
      '<div class="nome">' + esc(p.destinatario) + '</div>' +
      '<div class="end">' + esc(p.endereco || '—') + '</div>' +
      '<div class="meta"><span class="qtd">' + nItens + (nItens === 1 ? ' item' : ' itens') + '</span>' +
        '<span class="selo">' + selo(p.status) + '</span></div></div>';
  }

  function render() {
    var quadro = document.getElementById('quadro');
    if (!pedidos.length) { quadro.innerHTML = '<div class="vazio">Nenhum pedido para hoje ainda.</div>'; return; }
    quadro.innerHTML = colunas().map(function (c) {
      return '<div class="coluna ' + c.cls + '">' +
        '<h2><span>' + c.titulo + '</span><span class="conta">' + c.itens.length + '</span></h2>' +
        '<div class="lista">' + c.itens.map(cartaoHTML).join('') + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(quadro.querySelectorAll('.cartao'), function (el) {
      el.addEventListener('click', function () { abrir(el.getAttribute('data-code')); });
    });
  }

  // ── Status ────────────────────────────────────────────
  function mandarStatus(code, status) {
    fetch(STATUS_TMPL.replace('__CODE__', encodeURIComponent(code)) + '?status=' + status, {
      method: 'POST', headers: { 'X-CSRFToken': CSRF }
    }).catch(function () {});
  }
  function setStatus(code, status) {
    var p = pedidos.find(function (x) { return x.code === code; });
    if (!p) return;
    p.status = status;
    mandarStatus(code, status);
    render(); atualizarAlarme();
    if (abertoCode === code) { if (status === 'entregue') fecharDetalhe(); else abrirDetalhe(p); }
  }

  function abrir(code) {
    var p = pedidos.find(function (x) { return x.code === code; });
    if (!p) return;
    if (p.status === 'novo') { p.status = 'visto'; mandarStatus(code, 'visto'); render(); atualizarAlarme(); }
    abrirDetalhe(p);
  }

  function abrirDetalhe(p) {
    abertoCode = p.code;
    var temCart = (p.cartinha || '').trim().length > 0;
    var itens = (p.itens || []).map(function (it) {
      return '<div class="item"><b>' + (Number(it.qtd) || 1) + 'x</b> ' + esc(it.nome) + '</div>';
    }).join('') || '<div class="item">—</div>';
    var janela = p.expresso ? '⚡ Expresso (1h)' : ('🕐 ' + (p.periodo || 'Sem horário'));

    var acoes = '';
    if (p.status === 'entregue') {
      acoes = '<button class="btn-voltar" data-act="visto">↩ Reabrir</button>';
    } else if (p.status === 'pronto') {
      acoes = '<button class="btn-entregue" data-act="entregue">📦 ENTREGUE</button>' +
              '<button class="btn-voltar" data-act="visto">↩ Voltar</button>';
    } else {
      acoes = '<button class="btn-pronto" data-act="pronto">✓ PRONTO</button>' +
              '<button class="btn-entregue" data-act="entregue">📦 ENTREGUE</button>';
    }

    document.getElementById('detalhe-box').innerHTML =
      '<div class="d-nome">' + esc(p.destinatario) + '</div>' +
      '<div class="d-end">📍 ' + esc(p.endereco || '—') + '</div>' +
      (p.telefone ? '<div class="d-tel">📞 ' + esc(p.telefone) + '</div>' : '') +
      '<div><span class="d-janela ' + (p.expresso ? 'expr' : '') + '">' + esc(janela) + '</span></div>' +
      '<div class="cartinha-bloco ' + (temCart ? '' : 'vazia') + '">' +
        '<div class="lbl">💌 Cartinha (escrever à mão)</div>' +
        '<div class="txt">' + (temCart ? esc(p.cartinha) : 'Este pedido não tem cartinha.') + '</div></div>' +
      '<div class="itens-lista">' + itens + '</div>' +
      lalamoveHTML(p) +
      '<div class="acoes">' + acoes + '</div>' +
      '<button class="btn-fechar" data-act="fechar">FECHAR</button>';

    Array.prototype.forEach.call(document.querySelectorAll('#detalhe-box [data-act]'), function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-act');
        if (act === 'fechar') fecharDetalhe(); else setStatus(p.code, act);
      });
    });
    ligarLalamove(p);
    document.getElementById('detalhe').classList.add('on');
  }

  // ── Lalamove (chamar entregador quando PRONTO) ─────────
  var lalaCotacao = null;   // {entrega_id, valor, ...} da cotação corrente

  function lalamoveHTML(p) {
    var L = p.lalamove;
    if (L) {
      var linhas = '<div class="lala-st">🛵 Lalamove: <b>' + esc(L.rotulo) + '</b>' +
        (L.valor ? ' · R$ ' + esc(L.valor) : '') +
        (L.veiculo ? ' · ' + esc(L.veiculo) : '') + '</div>' +
        (L.motorista ? '<div class="lala-mot">👤 ' + esc(L.motorista) +
          (L.motorista_fone ? ' · ' + esc(L.motorista_fone) : '') + '</div>' : '') +
        (L.share_link ? '<div><a class="lala-link" target="_blank" href="' +
          esc(L.share_link) + '">📡 Acompanhar entrega</a></div>' : '');
      var botoes = '';
      if (L.pode_cancelar) {
        botoes += '<button class="lala-btn cancelar" data-lala="cancelar" data-id="' +
                  L.id + '">✕ Cancelar corrida</button>';
      }
      if (L.encerrada && p.status === 'pronto') {
        botoes += '<button class="lala-btn" data-lala="nova">🛵 Chamar de novo</button>';
      }
      return '<div class="lala-box">' + linhas + botoes + '</div>';
    }
    if (p.status !== 'pronto') return '';
    var opcoes = LALA_VEICULOS.map(function (v) {
      return '<option value="' + esc(v[0]) + '">' + esc(v[1]) + '</option>';
    }).join('');
    return '<div class="lala-box">' +
      '<div class="lala-st">🛵 <b>Chamar entregador (Lalamove)</b></div>' +
      '<input class="lala-end" id="lala-end" value="' + esc(p.endereco || '') + '"' +
        ' placeholder="endereço de entrega" title="Pode editar: tire apto/bloco se o mapa não achar, ou cole coordenadas lat,lng">' +
      '<div class="lala-veic"><select id="lala-veic">' + opcoes + '</select></div>' +
      '<div class="lala-res" id="lala-res"></div>' +
      '<button class="lala-btn" data-lala="cotar">💰 Ver preço</button>' +
      '<button class="lala-btn chamar" data-lala="chamar" style="display:none">✓ CHAMAR ENTREGADOR</button>' +
      '</div>';
  }

  function lalaErro(msg) {
    var r = document.getElementById('lala-res');
    if (r) { r.innerHTML = '<span class="lala-erro">⚠ ' + esc(msg) + '</span>'; }
  }

  function ligarLalamove(p) {
    Array.prototype.forEach.call(
        document.querySelectorAll('#detalhe-box [data-lala]'), function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-lala');
        if (act === 'nova') { p.lalamove = null; abrirDetalhe(p); return; }
        if (act === 'cotar') {
          var veic = (document.getElementById('lala-veic') || {}).value || 'moto';
          var endInput = document.getElementById('lala-end');
          var endereco = (endInput && endInput.value.trim()) || p.endereco || '';
          b.disabled = true;
          document.getElementById('lala-res').textContent = 'Cotando...';
          fetch(LALA_COTAR, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
            body: JSON.stringify({ code: p.code, endereco: endereco,
                                   destinatario: p.destinatario,
                                   telefone: p.telefone, veiculo: veic })
          }).then(function (r) { return r.json(); }).then(function (d) {
            b.disabled = false;
            if (!d.ok) { lalaErro(d.erro || 'falhou'); return; }
            lalaCotacao = d;
            document.getElementById('lala-res').innerHTML =
              '<b>R$ ' + esc(d.valor) + '</b>' +
              (d.distancia ? ' · ' + esc(d.distancia) : '') + ' · ' + esc(d.veiculo);
            var bc = document.querySelector('#detalhe-box [data-lala="chamar"]');
            if (bc) bc.style.display = '';
          }).catch(function () { b.disabled = false; lalaErro('sem conexão'); });
          return;
        }
        if (act === 'chamar') {
          if (!lalaCotacao) { lalaErro('cote o preço primeiro'); return; }
          if (!confirm('Chamar entregador (' + lalaCotacao.veiculo + ', R$ ' +
                       lalaCotacao.valor + ') para:\n' + (p.endereco || ''))) return;
          b.disabled = true;
          fetch(LALA_CHAMAR, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
            body: JSON.stringify({ entrega_id: lalaCotacao.entrega_id })
          }).then(function (r) { return r.json(); }).then(function (d) {
            b.disabled = false;
            if (!d.ok) { lalaErro(d.erro || 'falhou'); return; }
            lalaCotacao = null;
            p.lalamove = d.lalamove;
            abrirDetalhe(p); carregar();
          }).catch(function () { b.disabled = false; lalaErro('sem conexão'); });
          return;
        }
        if (act === 'cancelar') {
          if (!confirm('Cancelar a corrida Lalamove deste pedido?')) return;
          b.disabled = true;
          fetch(LALA_CANCELAR, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
            body: JSON.stringify({ entrega_id: b.getAttribute('data-id') })
          }).then(function (r) { return r.json(); }).then(function (d) {
            b.disabled = false;
            if (!d.ok) { lalaErro(d.erro || 'falhou'); return; }
            p.lalamove = d.lalamove;
            abrirDetalhe(p); carregar();
          }).catch(function () { b.disabled = false; lalaErro('sem conexão'); });
        }
      });
    });
  }
  function fecharDetalhe() { abertoCode = null; document.getElementById('detalhe').classList.remove('on'); }
  document.getElementById('detalhe').addEventListener('click', function (e) {
    if (e.target.id === 'detalhe') fecharDetalhe();
  });

  // ── Dados ─────────────────────────────────────────────
  function setConexao(ok) { document.getElementById('conexao').classList.toggle('off', !ok); }
  function setErro(msg) {
    var b = document.getElementById('erro-banner');
    if (msg) { b.textContent = '⚠ ' + msg; b.classList.add('on'); } else b.classList.remove('on');
  }
  function carregar() {
    fetch(ENDPOINT, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        setConexao(true);
        if (data.erro) { setErro('Não consegui atualizar agora. Mostrando o último que carregou.'); return; }
        setErro('');
        // Preserva status local de quem acabou de mudar (evita "piscar" de volta
        // antes do servidor confirmar): o servidor e a fonte da verdade, mas se
        // o detalhe esta aberto, nao sobrescreve o card aberto.
        pedidos = data.pedidos || [];
        render(); atualizarAlarme();
        if (abertoCode) {
          var p = pedidos.find(function (x) { return x.code === abertoCode; });
          if (p) abrirDetalhe(p); else fecharDetalhe();
        }
      })
      .catch(function () { setConexao(false); });
  }

  function tick() {
    var d = new Date();
    document.getElementById('relogio').textContent =
      ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function dataHoje() {
    var dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    var d = new Date();
    document.getElementById('data-hoje').textContent =
      dias[d.getDay()] + ', ' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  document.getElementById('btn-arm').addEventListener('click', function () {
    armAudio();
    document.getElementById('arm').style.display = 'none';
    carregar();
    setInterval(carregar, 20000);
  });
  dataHoje(); tick(); setInterval(tick, 10000);
})();
</script>
</body>
</html>
