{% extends "base.html" %}
{% block title %}{% if fornecedor %}Editar{% else %}Novo{% endif %} Fornecedor{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{% if fornecedor %}editar{% else %}novo{% endif %} fornecedor</h1>
    <div class="page-actions">
        <a href="{{ url_for('fornecedores.lista') }}" class="btn-pill btn-pill-outline">
            <i class="bi bi-arrow-left"></i> voltar
        </a>
    </div>
</div>

<div class="card" style="padding:24px; max-width:720px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">nome *</label>
                <input type="text" name="nome" class="form-control" required
                       value="{{ fornecedor.nome if fornecedor else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">cnpj</label>
                <input type="text" name="cnpj" class="form-control"
                       value="{{ fornecedor.cnpj or '' if fornecedor else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">contato</label>
                <input type="text" name="contato" class="form-control" placeholder="nome do vendedor"
                       value="{{ fornecedor.contato or '' if fornecedor else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">telefone</label>
                <input type="text" name="telefone" class="form-control"
                       value="{{ fornecedor.telefone or '' if fornecedor else '' }}">
            </div>
            <div class="col-12">
                <label class="form-label">email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ fornecedor.email or '' if fornecedor else '' }}">
            </div>
            <div class="col-12">
                <label class="form-label">observação</label>
                <textarea name="observacao" class="form-control" rows="3">{{ fornecedor.observacao or '' if fornecedor else '' }}</textarea>
            </div>
            {% if fornecedor %}
            <div class="col-12">
                <label class="form-check">
                    <input type="checkbox" name="ativo" value="1" class="form-check-input" {% if fornecedor.ativo %}checked{% endif %}>
                    <span class="form-check-label">ativo</span>
                </label>
            </div>
            {% endif %}
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn-pill btn-pill-primary">
                <i class="bi bi-check-lg"></i> salvar
            </button>
            <a href="{{ url_for('fornecedores.lista') }}" class="btn-pill btn-pill-outline">cancelar</a>
            {% if fornecedor %}
            <form method="POST" action="{{ url_for('fornecedores.excluir', id=fornecedor.id) }}"
                  class="ms-auto" onsubmit="return confirm('Excluir/desativar {{ fornecedor.nome }}?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn-pill btn-pill-outline" style="border-color:var(--cor-vermelho); color:var(--cor-vermelho);">
                    <i class="bi bi-trash"></i> excluir
                </button>
            </form>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
