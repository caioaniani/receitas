<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wi-Fi O Pão — Cadastro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
         sans-serif; background: #faf6f0; color: #2b2b2b; padding: 18px;
         max-width: 460px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 14px 0 4px; }
  .sub { color: #7a6a55; margin-bottom: 18px; font-size: 15px; }
  .marca { font-weight: 800; letter-spacing: .5px; color: #a4501f;
           font-size: 15px; margin-top: 8px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=password],
  select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid
           #d8cbb8; border-radius: 10px; background: #fff; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .lgpd { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0;
          font-size: 13px; color: #55503f; }
  .lgpd input { margin-top: 3px; transform: scale(1.3); }
  button { width: 100%; padding: 15px; font-size: 17px; font-weight: 700;
           color: #fff; background: #a4501f; border: 0; border-radius: 12px;
           margin-top: 6px; }
  .erros { background: #fdecec; border: 1px solid #f5b5b5; border-radius: 10px;
           padding: 10px 14px; margin: 12px 0; color: #8a2222; font-size: 14px; }
  .aviso-opc { color: #9a8a70; font-weight: 400; font-size: 12px; }
</style>
</head>
<body>
  <div class="marca">O PÃO — PADARIA ARTESANAL</div>
  <h1>Wi-Fi grátis 🥐</h1>
  <p class="sub">Cadastre-se uma vez e navegue à vontade — e sua conta do
  nosso site já sai pronta, com login automático.</p>

  {% if erros %}
  <div class="erros">{% for e in erros %}• {{ e }}<br>{% endfor %}</div>
  {% endif %}

  <form method="post" action="{{ url_for('loja.wifi_cadastrar') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for k, v in (params or {}).items() %}
    <input type="hidden" name="{{ k }}" value="{{ v }}">
    {% endfor %}

    <label>Nome</label>
    <input type="text" name="nome" required autocomplete="name"
           value="{{ form.get('nome', '') }}">

    <label>E-mail</label>
    <input type="email" name="email" required autocomplete="email"
           value="{{ form.get('email', '') }}">

    <label>WhatsApp (com DDD)</label>
    <input type="tel" name="telefone" required autocomplete="tel"
           placeholder="(11) 99999-9999" value="{{ form.get('telefone', '') }}">

    <label>Crie uma senha <span class="aviso-opc">(para o site da
      padaria)</span></label>
    <input type="password" name="senha" required minlength="6"
           autocomplete="new-password">

    <label>Aniversário <span class="aviso-opc">(ano é opcional)</span></label>
    <div class="row">
      <div><select name="aniversario_dia" required>
        <option value="">Dia</option>
        {% for d in range(1, 32) %}
        <option value="{{ d }}" {% if form.get('aniversario_dia') == d|string %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select></div>
      <div><select name="aniversario_mes" required>
        <option value="">Mês</option>
        {% for m in ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'] %}
        <option value="{{ loop.index }}" {% if form.get('aniversario_mes') == loop.index|string %}selected{% endif %}>{{ m }}</option>
        {% endfor %}
      </select></div>
      <div><select name="nascimento_ano">
        <option value="">Ano</option>
        {% for a in range(2012, 1929, -1) %}
        <option value="{{ a }}" {% if form.get('nascimento_ano') == a|string %}selected{% endif %}>{{ a }}</option>
        {% endfor %}
      </select></div>
    </div>

    <div class="lgpd">
      <input type="checkbox" name="aceite_lgpd" id="lgpd" value="1" required>
      <label for="lgpd" style="margin:0; font-weight:400;">Aceito que a
      O Pão Padaria Artesanal use meus dados para criar minha conta no site
      e me enviar comunicações sobre produtos e novidades. Posso pedir a
      exclusão a qualquer momento pelos nossos canais de atendimento.</label>
    </div>

    <button type="submit">Continuar</button>
  </form>
</body>
</html>
