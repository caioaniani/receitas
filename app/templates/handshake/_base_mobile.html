<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Confirmar pedido{% endblock %}</title>
<!--
  Fluxo de campo (loja escaneia QR, tira fotos, digita PIN). O CSS do
  Bootstrap vem do CDN de forma NÃO render-blocking (media=print + onload):
  a página pinta na hora com o CSS inline abaixo e o Bootstrap entra depois.
  Se a rede da loja não alcançar o CDN, a tela ainda funciona — o CSS inline
  cobre o layout essencial (form do PIN, botões, alertas). Incidente
  15/06/2026 (pedido #202): link render-blocking travava o primeiro paint
  numa rede ruim → "tela preta / página não concluiu".
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      media="print" onload="this.media='all'">
<noscript>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</noscript>
<style>
* { box-sizing: border-box; }
body { background:#f6f7fb; margin:0; color:#222;
       font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px 40px; }
.card-soft { border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); background:#fff; }
.h1-mini { font-size:18px; font-weight:700; margin:0 0 8px; }
.kv { font-size:13px; color:#555; }
.kv strong { color:#222; }
.btn-acao { width:100%; padding:14px; font-size:16px; font-weight:600; border-radius:10px; }
.pin-input { font-size:24px; text-align:center; letter-spacing:6px; }
.status-pill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
/* Fallback mínimo caso o Bootstrap do CDN não carregue (rede da loja ruim):
   garante que form do PIN, botões e alertas continuem legíveis e usáveis. */
.btn { display:inline-block; padding:8px 14px; border-radius:8px; border:1px solid #adb5bd;
       background:#fff; color:#222; text-decoration:none; font-weight:600; cursor:pointer; }
.btn-primary { background:#0d6efd; border-color:#0d6efd; color:#fff; }
.btn-outline-secondary { background:#fff; color:#495057; }
.form-control { width:100%; padding:10px; border:1px solid #ced4da; border-radius:8px; font-size:16px; }
.alert { padding:10px 12px; border-radius:10px; font-size:13px; border:1px solid transparent; margin-bottom:12px; }
.alert-success { background:#d1e7dd; color:#0f5132; border-color:#badbcc; }
.alert-warning { background:#fff3cd; color:#664d03; border-color:#ffe69c; }
.alert-danger  { background:#f8d7da; color:#842029; border-color:#f5c2c7; }
.alert-info    { background:#cff4fc; color:#055160; border-color:#b6effb; }
.badge { display:inline-block; padding:3px 7px; border-radius:8px; font-size:11px; color:#fff; }
.bg-success { background:#198754; }
@media (max-width:480px) {
    .wrap { padding: 12px 10px 32px; }
}
</style>
</head>
<body>
<div class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat if cat in ['success','warning','danger','info'] else 'info' }} py-2 px-3 small">{{ msg }}</div>
    {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
