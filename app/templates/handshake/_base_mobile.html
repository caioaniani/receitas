<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Confirmar pedido{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { background:#f6f7fb; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px 40px; }
.card-soft { border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
.h1-mini { font-size:18px; font-weight:700; margin:0 0 8px; }
.kv { font-size:13px; color:#555; }
.kv strong { color:#222; }
.btn-acao { width:100%; padding:14px; font-size:16px; font-weight:600; border-radius:10px; }
.pin-input { font-size:24px; text-align:center; letter-spacing:6px; }
.status-pill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
@media (max-width:480px) {
    .wrap { padding: 12px 10px 32px; }
}
</style>
</head>
<body>
<div class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat if cat in ['success','warning','danger','info'] else 'info' }} py-2 px-3 small">{{ msg }}</div>
    {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
