name: CI

on:
  push:
  pull_request:

# Cancela runs em andamento do mesmo ref quando chega push novo — o
# auto-commit empurra varios commits seguidos, entao so o ultimo importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A suite sobe o app inteiro por teste (~16 min). 10 min cortava no meio
    # ("Cancelled after 10m"); 25 da folga ate otimizarmos o tempo do suite.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff (lint)
        run: ruff check app/ tests/

      - name: Pytest
        # `python -m pytest` adiciona cwd ao sys.path (vs `pytest` direto
        # que nao adiciona). Sem isso, `from app import ...` falha no CI.
        run: python -m pytest -q --tb=short
        env:
          # SECRET_KEY obrigatorio em prod (Postgres). Como CI usa SQLite
          # in-memory via conftest.py, o fallback dev gera SECRET_KEY
          # automatica — definir explicitamente so pra silenciar warning.
          SECRET_KEY: ci-test-secret-not-secret
