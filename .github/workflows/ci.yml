name: CI

on:
  push:
  pull_request:

# Cancela runs em andamento do mesmo ref quando chega push novo — o
# auto-commit empurra varios commits seguidos, entao so o ultimo importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Suite ~12 min apos pular seeds em teste (PYTEST_RUNNING). Com install +
    # ruff da ~15 min de wall time no runner. 25 mantem margem de seguranca —
    # falha falsa por timeout travaria deploy (Wait for CI), entao folga > corte.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 3.12 = a MESMA versão do Dockerfile (python:3.12-slim) que roda em
          # produção. Estava 3.11: o CI validava uma versão que o Railway não
          # executa (alinhado em 13/08/2026 a pedido do dono).
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-xdist

      - name: Ruff (lint)
        run: ruff check app/ tests/

      - name: Pytest
        # `python -m pytest` adiciona cwd ao sys.path (vs `pytest` direto
        # que nao adiciona). Sem isso, `from app import ...` falha no CI.
        # `-n auto` (xdist, 09/08/2026): 1 worker por nucleo, cada um com
        # SQLite proprio (conftest marca _PADARIA_TEST_DB_AUTO pra o worker
        # sobrescrever a env herdada do controlador — sem isso os workers
        # dividiam 1 arquivo e a suite explodia com "table already exists").
        run: python -m pytest -q --tb=short -n auto
        env:
          # SECRET_KEY obrigatorio em prod (Postgres). Como CI usa SQLite
          # in-memory via conftest.py, o fallback dev gera SECRET_KEY
          # automatica — definir explicitamente so pra silenciar warning.
          SECRET_KEY: ci-test-secret-not-secret
